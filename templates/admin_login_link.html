{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="glass-panel p-8 rounded-lg">
        <h2 class="text-2xl font-bold text-white mb-2">Login link generated</h2>
        <p class="text-sm text-gray-400 mb-6">
            Send this link to <span class="text-white font-semibold">{{ user.username }}</span>.
            It works once and expires in <strong>15 minutes</strong> from generation
            — after they use it, their Discord is permanently bound to the account.
        </p>
        <div class="bg-slate-900 border border-slate-700 rounded p-3 break-all font-mono text-xs text-blue-300 select-all">{{ login_url }}</div>
        <div class="mt-4 flex gap-3">
            <button onclick="navigator.clipboard.writeText('{{ login_url }}').then(() => { this.textContent='Copied!'; setTimeout(() => this.textContent='Copy link', 1500); })" class="bg-slate-700 hover:bg-slate-600 text-white text-sm px-4 py-2 rounded-lg">Copy link</button>
            <a href="{{ url_for('admin.admin_user_edit', user_id=user.id) }}" class="text-gray-400 hover:text-gray-300 text-sm self-center">Back to user</a>
        </div>
    </div>
</div>
{% endblock %}
