<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ error_code }} — The Bottom List</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#070812;color:#e2e8f0;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background-image:radial-gradient(circle at 50% 50%, rgba(96,165,250,0.06) 0%, transparent 60%);
}
.card{
    background:rgba(15,23,42,0.8);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;padding:48px;text-align:center;max-width:440px;
    box-shadow:0 30px 80px rgba(0,0,0,0.5);
}
.code{
    font-size:96px;font-weight:800;background:linear-gradient(135deg,#60a5fa,#a78bfa);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    line-height:1;margin-bottom:8px;
}
.title{font-size:22px;font-weight:600;margin-bottom:12px}
.msg{color:#94a3b8;font-size:15px;line-height:1.5;margin-bottom:32px}
a{
    display:inline-block;background:rgba(96,165,250,0.12);
    color:#93c5fd;text-decoration:none;padding:10px 28px;
    border-radius:8px;font-size:15px;font-weight:500;
    border:1px solid rgba(96,165,250,0.2);transition:all 0.15s;
}
a:hover{background:rgba(96,165,250,0.2);border-color:rgba(96,165,250,0.35)}
</style>
</head>
<body>
<div class="card">
    <div class="code">{{ error_code }}</div>
    <div class="title">{{ error_title }}</div>
    <div class="msg">{{ error_message }}</div>
    <a href="/">Go Home</a>
</div>
</body>
</html>
