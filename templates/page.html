{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="glass-panel p-8 rounded-lg">
        <h1 class="text-3xl font-bold text-white mb-4">{{ page.title }}</h1>
        {% if page.is_html %}
        <div class="text-gray-200 leading-relaxed">{{ page.body|safe }}</div>
        {% else %}
        <div class="text-gray-200 leading-relaxed whitespace-pre-wrap">{{ page.body }}</div>
        {% endif %}
    </div>
</div>
{% endblock %}
