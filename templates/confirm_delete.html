{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="glass-panel p-8 rounded-lg">
        <h2 class="text-3xl font-bold text-center text-red-400 mb-6">Delete Account</h2>
        <div class="bg-slate-800 p-6 rounded-lg border border-red-700 mb-6">
            <p class="text-gray-300 mb-4">
                This will disable your account immediately and schedule it for permanent deletion in 7 days.
            </p>
            <p class="text-gray-400 text-sm mb-4">
                To confirm, please type your username <strong class="text-white">{{ username }}</strong> below.
            </p>
            <p class="text-gray-500 text-xs">
                You can log in within 7 days to cancel the deletion.
            </p>
        </div>
        <form method="POST" action="{{ url_for('auth.delete_account') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="mb-6">
                <label for="confirm_username" class="block text-sm font-medium text-gray-400 mb-2">Type your username to confirm</label>
                <input type="text" name="confirm_username" id="confirm_username" required
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500">
            </div>
            <div class="flex gap-3">
                <a href="{{ url_for('profile.edit_profile') }}"
                   class="flex-1 text-center bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg transition-colors">
                    Cancel
                </a>
                <button type="submit"
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition-colors">
                    Delete My Account
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
