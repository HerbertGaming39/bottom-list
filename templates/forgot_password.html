{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="glass-panel p-8 rounded-lg text-center">
        <h2 class="text-3xl font-bold text-white mb-6">Forgot Password?</h2>
        <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 mb-6">
            <p class="text-gray-300 text-lg">
                Contact a site administrator on Discord for password recovery.
            </p>
        </div>
        <a href="{{ url_for('auth.login') }}" class="text-blue-400 hover:text-blue-300">&larr; Back to Login</a>
    </div>
</div>
{% endblock %}
