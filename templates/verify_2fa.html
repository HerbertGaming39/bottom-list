{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto glass-panel p-8 rounded-lg">
    <h2 class="text-2xl font-bold text-white mb-2">Two-factor verification</h2>
    <div class="text-sm text-gray-400 mb-6">Enter the 6-digit code from your authenticator app.</div>
    <form method="POST" action="" class="space-y-4">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="totp_code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required autofocus
               class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-3 text-white text-center text-xl font-mono tracking-widest">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg">Verify</button>
    </form>
</div>
{% endblock %}
