{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="glass-panel p-8 rounded-lg shadow-xl">
        <h2 class="text-2xl font-bold text-center text-white mb-4">Guidelines Agreement</h2>
        <p class="text-gray-300 text-sm mb-6">
            You must read and agree to the guidelines before continuing.
        </p>
        <div class="mb-6">
            <a href="{{ guidelines_url }}" target="_blank" rel="noopener noreferrer" class="w-full inline-flex justify-center bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3 rounded-lg transition-colors" aria-label="Open guidelines in new tab">
                Open Guidelines
            </a>
        </div>
        <form method="POST" action="{{ url_for('auth.guidelines', next=next) }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <label class="flex items-start gap-3 text-sm text-gray-300 mb-6">
                <input type="checkbox" name="agree" value="1" required class="mt-1">
                <span>I agree to the guidelines.</span>
            </label>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition-colors">
                Accept & Continue
            </button>
        </form>
        <div class="mt-6 text-center text-sm text-gray-400">
            <a href="{{ url_for('auth.logout') }}" class="text-gray-300 hover:text-white">Logout</a>
        </div>
    </div>
</div>
{% endblock %}
